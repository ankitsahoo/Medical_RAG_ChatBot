<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>🔍 AI Medical Chatbot</title>
    <style>
        /* 🌿 General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #d8eefe, #f6faff);
            margin: 0;
            padding: 2rem;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #0078d7;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        /* 💬 Chat Container */
        .chat-container {
            max-width: 750px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 🗨️ Chat Messages */
        #chat-box {
            max-height: 500px;
            overflow-y: auto;
            padding: 1rem;
            background-color: #f9f9f9;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* 👤 User Message */
        .user {
            background-color: #cde5ff;
            color: #003366;
            align-self: flex-end;
            text-align: right;
            border-top-right-radius: 0;
        }

        /* 🤖 Assistant Message */
        .assistant {
            background-color: #e9e9e9;
            color: #222;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        /* 🌟 Error Message */
        .error {
            color: #d9534f;
            text-align: center;
            font-weight: bold;
        }

        /* 📝 Input Area */
        form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 3rem;
            padding: 0.75rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
            transition: border 0.2s;
        }

        textarea:focus {
            border-color: #0078d7;
            outline: none;
        }

        /* 🚀 Buttons */
        button {
            background-color: #0078d7;
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #005fa3;
            transform: scale(1.02);
        }

        .clear-btn {
            background-color: #f44336;
        }

        .clear-btn:hover {
            background-color: #d32f2f;
        }

        /* 🌈 Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🩺 Scrollbar Styling */
        #chat-box::-webkit-scrollbar {
            width: 8px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        #chat-box::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h1>🔍 AI Medical Chatbot</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div id="chat-box">
            {% for msg in messages %}
                <div class="message {{ msg.role }}">
                    <strong>{{ msg.role|capitalize }}:</strong><br />
                    {{ msg.content | safe | nl2br }}
                </div>
            {% endfor %}
        </div>

        <form method="post" action="{{ url_for('index') }}">
            <textarea name="prompt" placeholder="Ask a medical question..." required></textarea>
            <button type="submit">💬 Send</button>
        </form>

        <form method="get" action="{{ url_for('clear') }}">
            <button type="submit" class="clear-btn">🧹 Clear Chat</button>
        </form>
    </div>
</body>
</html>
